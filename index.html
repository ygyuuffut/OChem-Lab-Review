const addedConcepts = [
 {id:'c-drying',topic:'separation',module:'techniques',title:'Dry the solution before the product',kicker:'Drying an organic extract',scope:'core',takeaway:'A suitable anhydrous drying agent removes small amounts of water dissolved in an organic phase.',body:['Separate visible bulk aqueous liquid first. A drying agent is not a substitute for separating a large water layer.','Compatible anhydrous salts such as sodium sulfate or magnesium sulfate are common examples. Choose the course-approved agent for the actual product and solvent.','Separate the solid drying agent before removing organic solvent. The isolated product may still need further drying before mass or melting measurements.'],trap:'Drying an organic solution and drying isolated crystals are distinct operations.',source:'columbia'},
 {id:'c-forces',topic:'polarity',module:'fundamentals',title:'Between molecules or within one?',kicker:'Intermolecular ≠ intramolecular',scope:'core',takeaway:'Intermolecular interactions act between molecules. Intramolecular bonds or interactions occur within a molecule.',body:['Melting a typical molecular solid rearranges intermolecular organization without breaking every covalent bond.','Intramolecular hydrogen bonding can compete with a molecule’s ability to hydrogen-bond to solvent. Compare actual structures and conformations.','Separate bond strength from the interactions responsible for physical properties.'],trap:'Melting a molecular crystal is not the same as chemically decomposing its molecules.',source:null},
 {id:'c-vacuum',topic:'separation',module:'techniques',title:'Collect the solid you want',kicker:'Vacuum filtration',scope:'core',takeaway:'A pressure difference pulls liquid through a filter while retaining suspended solid.',body:['Use it to collect crystals after they have formed. The filtrate contains solvent and dissolved material.','A small compatible cold rinse can remove mother liquor while limiting redissolution.','Suction removes bulk liquid; the solid may need further drying before accurate mass or melting analysis.'],trap:'A collected solid is not automatically completely dry or pure.',source:'mit'},
 {id:'c-column',topic:'separation',module:'techniques',title:'From a TLC spot to a collected fraction',kicker:'Column chromatography',scope:'core',takeaway:'A column separates components through repeated distribution between a stationary phase and a flowing mobile phase.',body:['In a common normal-phase silica system, stronger silica retention generally delays elution under otherwise identical conditions.','Use TLC of fractions to guide pooling. Fraction number or color alone is not proof of identity or purity.','A large sample load or unsuitable eluent can reduce resolution. TLC guides a choice; it does not guarantee a successful preparative separation.'],trap:'Combining every fraction can undo the separation.',source:'mit'},
 {id:'c-distill',topic:'separation',module:'techniques',title:'Different ways to distill',kicker:'Simple · fractional · co-distillation',scope:'core',takeaway:'Distillation exploits vapor–liquid behavior. The mixture determines which version is useful.',body:['Simple distillation can separate a volatile component from nonvolatile material or suitable liquids with sufficiently different volatility.','Fractional distillation provides repeated vaporization–condensation steps for closer-boiling mixtures; it cannot separate every mixture arbitrarily well.','In steam distillation of substantially immiscible liquids, the vapor-pressure contributions permit co-distillation below either pure-component boiling temperature at the same external pressure. Confirm your course’s intended co-distillation variant.'],trap:'A fractionating column improves equilibration; it does not defeat an azeotrope automatically.',source:'mit'},
 {id:'c-reflux',topic:'separation',module:'techniques',title:'Heat without collecting the solvent',kicker:'Reflux',scope:'core',takeaway:'Reflux returns condensed vapor to the reaction flask so a reaction can remain heated with reduced solvent loss.',body:['The condenser returns material to the same flask. A distillation setup instead directs condensate toward a receiver.','At a fixed pressure, the boiling mixture controls the reflux temperature. A hotter bath mainly increases the boil-up rate once steady boiling is established.','A standard teaching-lab reflux setup must not be sealed. Use the course-approved apparatus and conditions for the actual chemistry.'],trap:'Reflux is a reaction-maintenance technique, not a purification by itself.',source:'mit'},
 {id:'c-ir',topic:'identification',module:'analysis',title:'IR asks about molecular vibrations',kicker:'Infrared spectroscopy',scope:'core',takeaway:'IR absorption reports vibrational transitions and can support functional-group identification.',body:['Look for expected features and for changes from the starting material. Compare with an appropriate reference spectrum.','Band positions and shapes depend on the group and environment. One carbonyl band does not specify a whole structure.','Unexpected signals can suggest impurities, but an apparently clean IR spectrum does not establish exact purity.'],trap:'IR is spectroscopy of vibrations, not proton magnetic resonance.',source:'msu-ir'},
 {id:'c-nmr',topic:'identification',module:'analysis',title:'Read the proton environments together',kicker:'Proton nuclear magnetic resonance · ¹H NMR',scope:'core',takeaway:'Chemical shift, integration, and coupling patterns together help test a proposed structure.',body:['Chemical shift reflects proton environment; suitable integrations indicate relative proton amounts.','Consider symmetry, overlap, exchangeable protons, and the limits of simple first-order splitting rules.','Extra signals can arise from solvent, water, starting material, or byproducts. Quantitative purity needs suitable acquisition, assignment, and calibration.'],trap:'Counting signals alone does not count every proton or establish purity.',source:'msu-nmr'},
 {id:'c-tests',topic:'identification',module:'analysis',title:'A positive test is a clue',kicker:'Bromine & Tollens’ tests',scope:'core',takeaway:'Functional-group tests provide observations to interpret alongside controls and other evidence.',body:['Bromine consumption can support reactive unsaturation under suitable conditions. Other reactive groups can also consume bromine.','A silver mirror or silver deposition in a valid Tollens’ test supports a reducing functional group such as an aldehyde. It is not unique identification of one compound.','A negative result needs a functioning positive control and suitable sample contact before it rules anything out. Follow the approved handling and disposal procedure.'],trap:'A color change is an observation; the chemical assignment is an inference.',source:'csub-tests'},
 {id:'c-dehydration',topic:'reactions',module:'analysis',title:'From an alcohol to an alkene',kicker:'Acid-catalyzed dehydration',scope:'core',takeaway:'Dehydration eliminates the elements of water and can create a C=C bond.',body:['Acid can convert an OH group into a better leaving group. Mechanistic details depend on the substrate and conditions.','More than one alkene can be possible. Rearrangement is relevant when the pathway permits a carbocation.','Combine appropriate unsaturation testing and spectral evidence with product isolation. Do not assign an isomer from bromine consumption alone.'],trap:'The class of alcohol matters; do not force every dehydration into one mechanism.',source:'openstax'},
 {id:'c-soap',topic:'reactions',module:'analysis',title:'What saponification changes',kicker:'Base-promoted ester hydrolysis',scope:'core',takeaway:'Saponification of a triglyceride produces glycerol and fatty-acid carboxylate salts under basic conditions.',body:['Distinguish the carboxylate salt in a basic mixture from a neutral carboxylic acid obtained after acidification.','Soap has a polar ionic head and a nonpolar hydrocarbon region. These support amphiphilic behavior.','Foam alone is not a complete structural or purity test. Isolation conditions and further evidence matter.'],trap:'Transesterification and saponification give different products.',source:'openstax'},
 {id:'c-sn',topic:'reactions',module:'analysis',title:'Two substitution pathways',kicker:'SN1 & SN2',scope:'core',takeaway:'SN1 and SN2 differ in mechanism, rate dependence, and the factors that favor them.',body:['The ideal SN2 pathway is concerted; backside attack produces inversion at the reacting stereocenter.','The ideal SN1 pathway includes ionization to a carbocation. Solvent, ion pairing, and rearrangement can influence observations.','Consider substrate, leaving group, nucleophile, solvent, temperature, and competing elimination. A single rule cannot decide every experiment.'],trap:'SN1 does not guarantee an exactly 50:50 mixture in every real system.',source:'openstax'},
 {id:'c-grignard',topic:'reactions',module:'analysis',title:'Keep the carbon–magnesium bond useful',kicker:'Grignard chemistry · RMgBr',scope:'core',takeaway:'A Grignard reagent is an organomagnesium compound; its carbon-containing group can form a new C–C bond with a suitable carbonyl.',body:['For an organobromide precursor, write the reagent as RMgBr, not simply MgBr. The R group is essential.','Water and other compatible proton donors can consume the reagent in an acid–base reaction before carbonyl addition.','Carbonyl addition gives a magnesium alkoxide; the intended subsequent workup provides an alcohol. Exact products depend on both partners.'],trap:'Adding water before the carbonyl reaction is not the same as an intended final aqueous workup.',source:'grignard'},
 {id:'c-nitration',topic:'reactions',module:'analysis',title:'Replace an aromatic H with NO₂',kicker:'Electrophilic aromatic substitution',scope:'core',takeaway:'Aromatic nitration introduces a nitro group while restoring aromaticity after substitution.',body:['The nitronium ion, NO₂⁺, is the key electrophile in a common acid-mediated nitration model.','Existing substituents affect reactivity and positional preference. The actual substrate is needed to predict the course product.','Do not infer a single isomer or yield from the label “nitration.” Use the stated structure and evidence.'],trap:'Nitration is not addition across the ring that permanently removes aromaticity.',source:'openstax'},
 {id:'c-aspirin',topic:'reactions',module:'analysis',title:'What changes in aspirin synthesis?',kicker:'Acetylsalicylic acid',scope:'core',takeaway:'Aspirin formation acetylates the phenolic oxygen of salicylic acid while retaining its carboxylic acid group.',body:['The phenolic OH becomes an acetate ester. The product still contains a carboxylic acid.','The isolated solid can contain unreacted starting material or retained solvent. Evaluate identity, purity, and yield independently.','Use the exact approved experiment to choose workup and reference values. The synthesis name alone does not specify those details.'],trap:'Loss of a phenolic OH does not imply the product has no OH-containing functional group.',source:'openstax'},
 {id:'c-coumarin',topic:'reactions',module:'analysis',title:'Build a coumarin framework',kicker:'Knoevenagel condensation & cyclization',scope:'core',takeaway:'An appropriate ortho-hydroxy aldehyde and active-methylene partner can form a coumarin framework through condensation and ring formation.',body:['Identify the activated carbon donor and the carbonyl electrophile before tracing the new C–C bond.','The ortho hydroxyl arrangement can support formation of the lactone ring in a suitable route.','Different active-methylene partners give different substituted products. Confirm the actual starting materials before assigning formula, mass, or melting point.'],trap:'“Coumarin synthesis” does not guarantee unsubstituted coumarin is the isolated product.',source:'coumarin'}
];

 {id:'CASE-01',topic:'reactions',module:'separation',type:'multistep',difficulty:'Reasoning',scope:'core',priority:'High',title:'A crystalline aspirin product: plan, then judge',prompt:'Illustrative scenario, not the exact class procedure: an approved aspirin reaction and quench are complete. Crystals are present in cold mother liquor. The target is much less soluble cold than hot.',stages:[{prompt:'1 · Which operation directly collects the crystals?',options:['Vacuum filtration','Reflux alone','Collect only vapor'],answer:0},{prompt:'2 · Which rinse is most sensible under these stated assumptions?',options:['A large amount of hot solvent','A small amount of compatible cold solvent','Any reactive liquid'],answer:1},{prompt:'3 · What should happen before reporting mass-based yield and melting range?',options:['Assume suction guarantees complete dryness','Dry the isolated sample appropriately','Add mother liquor back to maximize mass'],answer:1}],hints:['The desired material is currently a suspended solid.','Think about redissolution and residual solvent at each step.'],explanation:'Collect the crystals, limit target dissolution during a compatible rinse, and dry before evaluating mass and melting. The actual course workup may contain additional steps.',concept:'c-aspirin'},

 'c-column':['Track what happens to separated material after it leaves the column.','Analyze collected fractions before deciding which ones to combine.'],
 'c-ir':['Distinguish molecular vibrations from proton nuclear-spin behavior.','IR is useful for expected functional-group features and changes; a single band does not uniquely establish the full structure.'],

  { id:'c-sol', topic:'solubility', title:'What does “soluble” actually mean?', kicker:'The starting point', scope:'core', takeaway:'Solubility describes how much solute is present in a saturated solution under specified conditions.', body:['Name the solute, solvent, temperature, and units. Without those details, “high solubility” is incomplete.','Do not confuse equilibrium solubility with dissolution rate. Stirring and smaller particles can speed dissolution without increasing the equilibrium limit.','A saturated solution is in equilibrium with undissolved solute. Adding more solute does not necessarily increase the dissolved concentration.'], trap:'Fast dissolving does not mean highly soluble.', source:'iupac', demo:'solubility' },
  { id:'c-pol', topic:'polarity', title:'Read the whole molecule', kicker:'Structure → interactions', scope:'core', takeaway:'Bond polarity and molecular polarity are related, but geometry decides whether bond dipoles cancel.', body:['Identify polar bonds and the three-dimensional arrangement of those bonds.','For neutral molecules, consider the balance of polar groups and the nonpolar carbon framework. A single OH group does not guarantee high water solubility.','“Like dissolves like” is a useful first prediction. Interactions, ionization, temperature, and the solid crystal lattice can all affect the result.'], trap:'A polar bond does not automatically make a polar molecule.', source:null, demo:'polarity' },
  { id:'c-mp', topic:'melting', title:'A melting range is evidence', kicker:'Observe → compare → qualify', scope:'core', takeaway:'Report the first liquid to the disappearance of the last solid, then compare both the range and its position with a reference.', body:['A narrow range near a reliable reference supports purity and consistency with an expected compound. It does not uniquely prove structure.','Many soluble impurities depress and broaden melting. Residual solvent and measurement conditions can also affect the result.','Dry the sample and use appropriate heating conditions. If a result is unexpected, investigate before concluding that the synthesis failed.'], trap:'One matching number is not a complete identification.', source:'york', demo:'melting' },
  { id:'c-extract', topic:'separation', title:'Move a compound between phases', kicker:'Technique example · scope pending', scope:'example', takeaway:'Liquid–liquid extraction uses distribution between immiscible liquid phases.', body:['Choose phases that separate, then consider where the target and impurities prefer to dissolve.','Density determines which layer is on top; it does not determine which layer contains your product.','Acid–base extraction can change ionization and therefore distribution. Keep every fraction until you know where the target is.'], trap:'The organic layer is not always the upper layer.', source:'columbia', demo:'extraction' },
  { id:'c-recryst', topic:'separation', title:'Purify a solid by crystallizing it', kicker:'Technique example · scope pending', scope:'example', takeaway:'Recrystallization can exploit greater target solubility in hot solvent than in cold solvent.', body:['A suitable solvent dissolves the target when hot and much less when cold, while allowing impurities to be removed.','Dissolve, cool, collect, and dry: each action has a different job. Hot filtration is only needed when insoluble material must be removed.','Some product remains in the mother liquor. Improved purity and recovered mass must be evaluated separately.'], trap:'More solvent can mean more product left in solution.', source:'columbia' },
  { id:'c-tlc', topic:'identification', title:'Use TLC as a comparison', kicker:'Technique example · scope pending', scope:'example', takeaway:'TLC separates components through different interactions with the stationary and mobile phases.', body:['For normal-phase silica TLC under the same conditions, stronger silica interactions often mean less travel.','Rf is spot distance divided by solvent-front distance from the same baseline. Solvent and plate conditions matter.','One spot or a matching Rf is supporting evidence. Components can co-elute or escape detection.'], trap:'Rf is not a universal molecular constant.', source:'mit', demo:'tlc' },
  { id:'c-order', topic:'sequence', title:'Let the purpose set the sequence', kicker:'Workup reasoning · example', scope:'example', takeaway:'A useful sequence depends on the mixture, target, and what each step requires.', body:['First establish the mixture and the target’s properties. Follow the approved quench and workup for a real experiment.','For a target already in a wet organic extract: separate unwanted aqueous phase, dry the organic solution, remove drying solid, then remove solvent.','Characterize an appropriately isolated sample. A fixed sequence is not correct for every reaction.'], trap:'A memorized workup is not a universal workup.', source:'mit' },

const questions = [
  { id:'SOL-01',topic:'solubility',type:'mcq',difficulty:'Foundation',scope:'core',priority:'High',title:'Solubility or dissolution rate?',prompt:'A student crushes a solid and stirs the mixture. It dissolves faster, but the same mass remains dissolved at equilibrium at the same temperature. What changed?',options:['The equilibrium solubility increased.','The dissolution rate increased.','The molecular polarity decreased.','The solvent became saturated at a higher concentration.'],answer:1,hints:['Separate “how fast” from “how much.”','Compare the final equilibrium concentration, not the time to reach it.'],explanation:'Crushing and stirring can speed mass transfer. The unchanged equilibrium amount indicates no measured change in solubility.',concept:'c-sol' },
  { id:'SOL-02',topic:'solubility',type:'mcq',difficulty:'Foundation',scope:'core',priority:'Normal',title:'Describe a saturated solution',prompt:'At a fixed temperature, a solution is at equilibrium with undissolved solute. Adding more of the same solid does not change the dissolved concentration. The solution is…',options:['Always supersaturated.','Saturated.','Necessarily dilute.','Chemically decomposing.'],answer:1,hints:['Look for equilibrium with undissolved solute.','Saturation is a concentration limit under specified conditions.'],explanation:'A saturated solution has the equilibrium concentration for that solute and solvent under the specified conditions.',concept:'c-sol' },
  { id:'SOL-03',topic:'solubility',type:'matching',difficulty:'Foundation',scope:'core',priority:'Normal',title:'Give each solution its name',prompt:'Match each description with the appropriate term.',pairs:[['Below its equilibrium solubility limit','Unsaturated'],['At equilibrium with undissolved solute','Saturated'],['Above its equilibrium solubility limit','Supersaturated']],hints:['Begin with the equilibrium limit.','Supersaturation is not the same as equilibrium with extra solid.'],explanation:'Unsaturated, saturated, and supersaturated refer to concentration relative to the equilibrium solubility limit.',concept:'c-sol' },
  { id:'SOL-04',topic:'solubility',type:'scenario',difficulty:'Application',scope:'core',priority:'High',title:'How much solid stays dissolved?',prompt:'Hypothetical data: a solid has a solubility of 2.0 g per 100 mL of solvent at 20 °C. You equilibrate 1.0 g with 25 mL of that solvent at 20 °C. Assume no reaction or volume change. How much solid remains undissolved?',options:['0 g','0.25 g','0.50 g','1.0 g'],answer:2,hints:['Scale the solubility to 25 mL.','2.0 × 25/100 = 0.50 g can remain dissolved.'],explanation:'Only 0.50 g can dissolve at equilibrium, leaving 1.0 − 0.50 = 0.50 g undissolved.',concept:'c-sol' },
  { id:'POL-01',topic:'polarity',type:'mcq',difficulty:'Foundation',scope:'core',priority:'High',title:'Polar bonds, nonpolar molecule?',prompt:'CO₂ has polar C=O bonds. Why does an isolated CO₂ molecule have no net permanent dipole?',options:['Oxygen and carbon have identical electronegativity.','Its linear geometry makes the bond dipoles cancel.','Double bonds cannot be polar.','Every molecule containing carbon is nonpolar.'],answer:1,hints:['Think about the directions of the two bond dipoles.','CO₂ is linear and symmetric.'],explanation:'The equal bond dipoles point in opposite directions and cancel. Molecular geometry matters.',concept:'c-pol' },
  { id:'POL-02',topic:'polarity',type:'mcq',difficulty:'Application',scope:'core',priority:'High',title:'One OH group is not the whole story',prompt:'Ethanol and 1-octanol each have one OH group. Why is ethanol much more compatible with water?',options:['Ethanol has a smaller nonpolar carbon framework.','1-Octanol cannot form hydrogen bonds.','All alcohols have identical water solubility.','Longer carbon chains always increase polarity.'],answer:0,hints:['Both OH groups can interact with water.','Compare the size of the hydrocarbon portion.'],explanation:'The larger nonpolar framework in 1-octanol reduces water compatibility despite its OH group.',concept:'c-pol' },
  { id:'POL-03',topic:'polarity',type:'matching',difficulty:'Foundation',scope:'core',priority:'Normal',title:'Match the interaction',prompt:'Select the interaction most directly illustrated by each description.',pairs:[['A cation surrounded by oriented water molecules','Ion–dipole'],['An O–H donor interacting with an oxygen lone pair','Hydrogen bonding'],['Instantaneous dipoles in nonpolar molecules','London dispersion']],hints:['Start with the description that contains a formal charge.','Hydrogen bonding needs an appropriate donor and acceptor.'],explanation:'All molecules exhibit dispersion; these descriptions isolate additional characteristic interactions.',concept:'c-pol' },
  { id:'POL-04',topic:'polarity',type:'scenario',difficulty:'Reasoning',scope:'core',priority:'High',title:'When “like dissolves like” is not enough',prompt:'A polar crystalline compound dissolves poorly in water. Which is the most defensible conclusion?',options:['The observation is impossible.','Polarity alone does not account for all factors, including the solid lattice.','The compound must contain no polar bonds.','Water is a nonpolar solvent.'],answer:1,hints:['Dissolving a crystal requires disrupting its original interactions.','Favorable solvation must compete with other energetic and entropic factors.'],explanation:'Polarity is a guide, not a guarantee. Solid-state interactions and conditions also influence solubility.',concept:'c-pol' },
  { id:'MP-01',topic:'melting',type:'mcq',difficulty:'Foundation',scope:'core',priority:'High',title:'Read the melting range',prompt:'The first liquid appears at 117 °C and the last crystal disappears at 120 °C. What should you report?',options:['117 °C only','120 °C only','118.5 °C only','117–120 °C'],answer:3,hints:['Melting is recorded over an interval.','Use the onset and completion temperatures.'],explanation:'Report the observed onset-to-completion range: 117–120 °C.',concept:'c-mp' },
  { id:'MP-02',topic:'melting',type:'scenario',difficulty:'Application',scope:'core',priority:'High',title:'The range is lower and wider',prompt:'Hypothetical reference: 128–130 °C. Your sample: 115–124 °C. What is the best next conclusion?',options:['This proves the target never formed.','It is consistent with contamination or a measurement issue; investigate further.','The sample is definitely pure.','The only explanation is a different molecular mass.'],answer:1,hints:['A melting range is evidence, not a verdict.','Consider residual solvent, impurities, and measurement conditions.'],explanation:'A depressed, broad range warrants investigation. It does not by itself distinguish contamination, handling issues, or an incorrect product.',concept:'c-mp' },
  { id:'MP-03',topic:'melting',type:'mcq',difficulty:'Reasoning',scope:'core',priority:'Normal',title:'Does a matching range prove identity?',prompt:'A dry sample has a narrow melting range close to the expected reference. Which claim is justified?',options:['Its entire molecular structure is proven.','It supports consistency with the target, alongside other evidence.','No other compound could melt there.','The isolated yield must be 100%.'],answer:1,hints:['Different compounds can have similar melting ranges.','Identity and yield are different questions.'],explanation:'A matching range supports identification and purity assessment, but is not a unique structural proof.',concept:'c-mp' },
  { id:'MP-04',topic:'melting',type:'ordering',difficulty:'Application',scope:'core',priority:'Normal',title:'From observation to interpretation',prompt:'Put these steps in a defensible order for interpreting a melting point result.',items:['Check sample condition and measurement conditions','Record onset and completion temperatures','Compare range and position with a reliable reference','Combine with other evidence before drawing a conclusion'],hints:['Make the observation reliable before interpreting it.','Comparison precedes the final conclusion.'],explanation:'Check conditions, measure and record, compare, then draw a qualified conclusion using complementary evidence.',concept:'c-mp' },
  { id:'ID-01',topic:'identification',type:'matching',difficulty:'Foundation',scope:'core',priority:'High',title:'What does the evidence answer?',prompt:'Match each question with the concept it addresses.',pairs:[['What compound did I obtain?','Identity'],['How much starting material reacted?','Conversion'],['How clean is my sample?','Purity'],['How much target did I isolate vs. the theoretical maximum?','Isolated yield']],hints:['A product can have the right identity and still be impure.','Conversion describes the starting material, not the isolated recovery.'],explanation:'These four measures are related but not interchangeable. Evaluate each one separately.',concept:'c-evidence' },
  { id:'ID-02',topic:'identification',type:'scenario',difficulty:'Reasoning',scope:'core',priority:'High',title:'The “108% yield” problem',prompt:'The recovered mass is 108% of the theoretical mass of pure target. What should you do first?',options:['Declare an exceptionally successful reaction.','Investigate residual solvent, contamination, calculations, and weighing.','Change the theoretical yield until the result is 100%.','Assume a new chemical law was discovered.'],answer:1,hints:['Theoretical yield assumes the intended pure compound.','The balance measures all material present.'],explanation:'An apparent yield above 100% indicates the mass or assumptions need investigation; it does not demonstrate extra target formation.',concept:'c-evidence' },
  { id:'ID-03',topic:'identification',type:'scenario',difficulty:'Reasoning',scope:'core',priority:'High',title:'Low yield, right product',prompt:'Independent evidence supports a pure target, but isolated yield is low. Which interpretation is most careful?',options:['No target was formed.','The target was obtained, but conversion, side reactions, and workup losses need evaluation.','Low yield proves high contamination.','Purity measurements must be wrong.'],answer:1,hints:['Separate product quality from quantity.','Material can be lost during isolation even if the chemistry works.'],explanation:'Low isolated yield alone does not locate the loss. Evaluate conversion, selectivity, and isolation before assigning a cause.',concept:'c-evidence' },
  { id:'SEP-01',topic:'separation',type:'matching',difficulty:'Foundation',scope:'example',priority:'Normal',title:'Choose the property, then the technique',prompt:'Match each separation principle with a commonly associated technique. These are general examples awaiting course-scope confirmation.',pairs:[['Different distributions between immiscible liquids','Liquid–liquid extraction'],['Different volatility','Distillation'],['Temperature-dependent solid solubility','Recrystallization'],['Different stationary/mobile phase interactions','Chromatography']],hints:['Do not start from a piece of glassware. Start from the property.','Volatility points toward a vapor–liquid separation.'],explanation:'Different techniques exploit different physical properties. The real mixture determines which method is practical.',concept:'c-extract' },
  { id:'SEP-02',topic:'separation',type:'mcq',difficulty:'Application',scope:'example',priority:'High',title:'Which layer is organic?',prompt:'A hypothetical organic extraction solvent has a density of 1.33 g/mL and forms a separate phase from water (1.00 g/mL). With no unusual dissolved-solute effects, where is the organic layer?',options:['Always on top because it is organic.','On the bottom because it is denser.','It cannot form a separate layer.','Its position is determined only by the product’s polarity.'],answer:1,hints:['Compare the densities of the two phases.','“Organic” does not mean “less dense than water.”'],explanation:'The denser phase is below the less dense phase. In a real mixture, confirm layer identity rather than relying on the word organic.',concept:'c-extract' },
  { id:'SEP-03',topic:'separation',type:'scenario',difficulty:'Reasoning',scope:'example',priority:'High',title:'A carboxylic acid and a neutral compound',prompt:'Illustrative mixture: a carboxylic acid (pKa about 4) and a stable neutral hydrocarbon are dissolved in a water-immiscible organic solvent. A compatible aqueous base converts the acid to its water-soluble carboxylate. What enables separation?',options:['Ionization changes the acid’s distribution between phases.','The neutral hydrocarbon always becomes ionic.','Every acid must remain in the organic phase.','A filter separates the two dissolved molecules by size.'],answer:0,hints:['Follow the acid’s charge before and after treatment.','The problem states the carboxylate is water-soluble.'],explanation:'Converting the acid to an ionic carboxylate favors its aqueous distribution under the stated assumptions. The neutral component preferentially stays organic.',concept:'c-extract' },

  if (question.type==='ordering') return Array.isArray(answer) && answer.length===question.items.length && answer.every((v,i)=>v===i);
  if (question.type==='matching') return Array.isArray(answer) && answer.length===question.pairs.length && answer.every((v,i)=>v===question.pairs[i][1]);
  return Number.isInteger(answer) && answer===question.answer;

function complete(question, answer) {

  if (question.type==='ordering') return Array.isArray(answer) && answer.length===question.items.length && new Set(answer).size===answer.length && answer.every(v=>Number.isInteger(v)&&v>=0&&v<question.items.length);

function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageProblem='';return true;}catch{storageProblem='Browser storage is unavailable or full. Export a backup to preserve this session.';toast(storageProblem);return false;}}
if(state.curriculumRevision<2){for(const initial of initialTodos){const previous=state.todos.find(t=>t.id===initial.id);if(!previous)state.todos.push(structuredClone(initial));else if(['scope-techniques','scope-id','scope-reactions','scope-final'].includes(initial.id)){previous.title=initial.title;previous.description=initial.description;if(initial.status==='Done'){previous.status='Done';previous.notes=[previous.notes,initial.notes].filter(Boolean).join('\n');}}}state.curriculumRevision=2;persist();}
const topic=id=>topics.find(t=>t.id===id)||topics[0];
const byId=id=>allQuestions(state).find(q=>q.id===id);
const allowed=q=>q.scope==='core'||state.settings.showExamples||state.scopeApprovals[q.id];
const fmtDate=(d,opts={month:'short',day:'numeric'})=>d?new Intl.DateTimeFormat('en-US',opts).format(new Date(d)):'Not scheduled';
const dateInput=d=>{if(!d)return '';const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
const localDateISO=s=>s?new Date(`${s}T09:00:00`).toISOString():'';
function stats(){const qs=visibleQuestions(state),rs=qs.map(q=>state.records[q.id]).filter(Boolean),attempts=qs.filter(q=>q.type!=='flashcard').flatMap(q=>state.records[q.id]?.attempts||[]);return {total:qs.length,attempts:attempts.length,reviewed:rs.filter(r=>r.attempts.length).length,correct:attempts.filter(a=>a.correct).length,mastered:rs.filter(r=>status(r)==='Mastered').length,due:qs.filter(q=>isDue(state.records[q.id])).length};}
const badge=(text,cls='')=>`<span class="badge ${cls}">${e(text)}</span>`;
const scopeBadge=q=>(q.scope==='example'&&!state.scopeApprovals[q.id])?badge('Scope pending','pending'):'';
function scopeControl(){return `<label class="example-toggle"><input type="checkbox" id="show-examples" ${state.settings.showExamples?'checked':''}><span>Include scope-pending additions</span>${icon('help',15)}</label>`;}
function render(){
 const s=stats();
 $('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#overview" aria-label="The Reaction Room overview"><span class="brand-mark">${icon('flask',26)}</span><span>The Reaction<span class="brand-second">Room<span class="brand-dot">.</span></span></span></a><div class="workspace-label">YOUR STUDY SPACE</div><nav aria-label="Main navigation">${nav.filter(([id])=>!(teaching()&&id==='scope')).map(([id,ic,label])=>`<a class="nav-link ${page===id?'active':''}" href="#${id}" ${page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${id==='mistakes'&&s.due?`<span class="nav-count">${s.due}</span>`:''}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-note">${icon('leaf',22)}<p>A little progress,<br><strong>every reaction.</strong></p></div><a class="nav-link ${page==='settings'?'active':''}" href="#settings">${icon('settings')}<span>Settings & backup</span></a><button class="profile" data-action="about"><span class="avatar">${teaching()?'S':'N'}</span><span><strong>${teaching()?'Student workspace':'My personal workspace'}</strong><small>Organic Chemistry · Final review</small></span>${icon('chevron',15)}</button></div></aside><div class="app-body"><header class="topbar"><button class="icon-button mobile-menu" data-action="menu" aria-label="Toggle navigation">${icon('menu')}</button><div class="breadcrumb">Workspace <span>/</span> <strong>${e(nav.find(n=>n[0]===page)?.[2]||'Settings')}</strong></div><div class="topbar-right"><button class="search-button" data-action="search" aria-label="Search questions">${icon('search',18)}<span>Find a question</span><kbd>⌘ K</kbd></button><span class="top-divider"></span><button class="mode-button ${teaching()?'is-teaching':''}" data-action="mode">${icon(teaching()?'globe':'lock',15)}<span>${teaching()?'Teaching preview':'Personal workspace'}</span>${icon('down',13)}</button></div></header><main id="main" tabindex="-1">${teaching()?`<div class="preview-banner">${icon('globe',17)}<span><strong>Teaching preview</strong> · Learner-facing presentation. Each browser keeps its own study record. Visitor access is managed separately through Sites.</span><button data-action="mode">Exit preview ${icon('x',14)}</button></div>`:''}${storageProblem?`<div class="warning-banner">${e(storageProblem)}</div>`:''}<div id="page-content">${({overview:overview,modules:modulePage,practice:practice,concepts:conceptPage,mistakes:mistakes,planner:planner,scope:scopePage,settings:settings}[page]||overview)()}</div><footer class="page-footer"><span>The Reaction Room <span>·</span> Understand the why.</span><button data-action="sources">References & content notes ${icon('external',12)}</button></footer></main></div>`;
 bindPage();
}
function pageHeading(eyebrow,title,description,action=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`;}
function heroArt(){return `<svg class="hero-art" viewBox="0 0 360 220" shape-rendering="crispEdges" aria-hidden="true"><defs><pattern id="pixel-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#91aa7b" stroke-width="1" opacity=".15"/></pattern></defs><rect x="15" y="10" width="330" height="200" fill="url(#pixel-grid)"/><path d="M129 25h58v8h-8v57h8v17h9v17h9v17h9v17h9v29h-9v8H101v-8h-9v-29h9v-17h9v-17h9v-17h10V33h-8v-8z" fill="#d6dfc7"/><path d="M137 33h34v61h8v17h9v17h8v17h9v17h9v17h-8v8H109v-8h-8v-17h9v-17h9v-17h9v-17h9V94z" fill="#315541"/><path d="M119 142h26v8h25v-8h26v17h9v18h-9v8h-78v-8h-9v-18h10z" fill="#abc88a"/><rect x="126" y="158" width="8" height="8" fill="#e3d691"/><rect x="161" y="171" width="6" height="6" fill="#e3d691"/><rect x="153" y="123" width="7" height="7" fill="#b1c991"/><path d="M236 85h86v100h-86z" fill="#152e2460"/><path d="M230 77h86v100h-86z" fill="#eee5bc"/><path d="M246 69h54v16h-54z" fill="#a8b488"/><rect x="243" y="98" width="9" height="9" fill="#c7ce9f"/><path d="m245 101 3 3 7-8" fill="none" stroke="#55734d" stroke-width="3"/><path d="M261 102h37M261 128h29M261 154h34" stroke="#9da985" stroke-width="4"/><rect x="243" y="124" width="9" height="9" fill="#c7ce9f"/><rect x="243" y="150" width="9" height="9" fill="#c7ce9f"/><path d="m245 127 3 3 7-8" fill="none" stroke="#55734d" stroke-width="3"/><path d="M64 54h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#d2ac72"/><path d="M253 22h14v14h-14zM285 44h8v8h-8zM55 155h10v10H55z" fill="#b9ca97"/><path d="M35 119h25v5h20M35 119v-18h25v18M60 101l17-13" fill="none" stroke="#c4ceac" stroke-width="3"/><rect x="71" y="82" width="12" height="12" fill="#b5bc8f"/></svg>`;}
function overview(){
 const s=stats(),qs=visibleQuestions(state),next=[...qs].sort((a,b)=>(isDue(state.records[b.id])?10:0)+(status(state.records[b.id])==='Learning'?5:0)-(isDue(state.records[a.id])?10:0)-(status(state.records[a.id])==='Learning'?5:0)).slice(0,3);
 return `${pageHeading('A GOOD DAY TO GET CURIOUS','Make the chemistry click.','Connect the concepts. Practice with purpose. Learn from every attempt.',`<span class="date-chip">${icon('calendar',15)} ${fmtDate(new Date(),{weekday:'short',month:'short',day:'numeric'})}</span>`)}<section class="hero"><div class="hero-copy"><span class="hero-kicker"><span></span> YOUR NEXT BREAKTHROUGH STARTS HERE</span><h2>Good questions.<br>Stronger thinking.</h2><p>Go beyond the right answer. Build the reasoning<br class="desktop-only"> that makes the next one easier.</p><div class="hero-actions"><button class="button cream" data-action="session">Start a study session ${icon('arrow',18)}</button><span>${state.settings.sessionSize} questions · at your pace</span></div></div>${heroArt()}</section><div class="stat-grid"><div class="stat-card"><span class="stat-icon mint">${icon('book')}</span><div><span>Questions explored</span><strong>${s.reviewed}<small> / ${s.total}</small></strong></div><span class="mini-progress" style="--progress:${s.total?s.reviewed/s.total*100:0}%"></span></div><div class="stat-card"><span class="stat-icon peach">${icon('clock')}</span><div><span>Ready for review</span><strong>${s.due}<small> due now</small></strong></div><button class="stat-link" data-action="due" aria-label="View questions due for review">${icon('arrow',19)}</button></div><div class="stat-card"><span class="stat-icon lavender">${icon('target')}</span><div><span>Practice accuracy</span><strong>${s.attempts?Math.round(s.correct/s.attempts*100)+'%':'—'}<small>${s.attempts?'across '+s.attempts+' checks':'your first answer awaits'}</small></strong></div></div><div class="stat-card"><span class="stat-icon sand">${icon('spark')}</span><div><span>Growing confidence</span><strong>${s.mastered}<small> mastered</small></strong></div></div></div>${moduleOverview()}<div class="overview-columns"><section class="panel next-panel"><div class="section-title"><div><h2>Pick up a little momentum</h2><p>A few good questions to get you thinking.</p></div><a href="#practice" class="text-link">View library ${icon('arrow',16)}</a></div><div class="suggested-list">${next.map(q=>questionRow(q,true)).join('')}</div><div class="panel-tip">${icon('spark',16)}<span>Not sure yet? Use a hint. Understanding comes first.</span></div></section><section class="panel map-panel"><div class="section-title"><div><h2>Your learning map</h2><p>One connection at a time.</p></div>${icon('route',21)}</div><div class="topic-progress">${topics.map(t=>{const tq=qs.filter(q=>q.topic===t.id),done=tq.filter(q=>latest(state.records[q.id])).length;return `<button data-action="topic" data-id="${t.id}" class="topic-progress-row"><span class="topic-dot ${t.color}"></span><span>${t.short}</span><small>${done}/${tq.length}</small><div class="progress-track"><span style="width:${tq.length?done/tq.length*100:0}%"></span></div></button>`;}).join('')}</div></section></div><div class="section-title explore-heading"><div><div class="eyebrow">BUILD YOUR FOUNDATION</div><h2>A concept before a question.</h2></div><a href="#concepts" class="text-link">Explore all concepts ${icon('arrow',16)}</a></div><div class="foundation-grid">${topics.slice(0,3).map((t,i)=>`<button class="foundation-card ${t.color}" data-action="concept" data-id="${['c-sol','c-pol','c-mp'][i]}"><span class="concept-number">0${i+1} / THE FUNDAMENTALS</span><span class="foundation-icon">${icon(t.icon,40)}</span><h3>${t.name}</h3><p>${t.description}</p><span class="foundation-bottom">Build the connection ${icon('arrow',18)}</span></button>`).join('')}</div><section class="scope-strip">${icon('flag',22)}<div><strong>Clear scope. Honest learning.</strong><p>Your 17 studied content areas are mapped. Exact experimental details and final-exam emphasis stay pending.</p></div><a href="#${teaching()?'concepts':'scope'}">${teaching()?'Explore concepts':'View scope & TODO'} ${icon('arrow',17)}</a></section>`;
}
function questionRow(q,compact=false){const r=state.records[q.id],t=topic(q.topic);return `<button class="question-row ${compact?'compact':''}" data-action="question" data-id="${e(q.id)}"><span class="question-type-icon ${t.color}">${icon({mcq:'list',matching:'matching',ordering:'route',scenario:'flask',flashcard:'layers',diagram:'scan',sorting:'grid',multistep:'route',data:'scan'}[q.type],21)}</span><span class="question-row-main"><span class="question-id">${e(q.id)} <span>·</span> ${e(t.short)}</span><strong>${e(q.title)}</strong><span class="question-meta">${e(types[q.type])}<span>·</span>${e(q.difficulty)}${scopeBadge(q)}</span></span><span class="question-row-right">${badge(status(r),status(r).toLowerCase())}${!compact?`<span class="priority ${r?.priority||q.priority}">${icon('flag',12)} ${e(r?.priority||q.priority)}</span>`:''}${icon('chevron',17)}</span></button>`;}
function selectFilter(id,label,options){return `<label class="filter-field"><span>${label}</span><select id="filter-${id}" data-filter="${id}"><option value="">${({Status:'All statuses',Priority:'All priorities',Difficulty:'All difficulties',Type:'All types',Topic:'All topics',Module:'All modules'})[label]}</option>${options.map(([v,l])=>`<option value="${e(v)}" ${filters[id]===v?'selected':''}>${e(l)}</option>`).join('')}</select></label>`;}
function practice(){return `${pageHeading('THE PRACTICE LIBRARY','A question worth asking.','Try, reflect, and come back a little stronger.',`<div class="heading-actions">${!teaching()?`<button class="button secondary" data-action="add-question">${icon('plus',17)} Add question</button>`:''}<button class="button primary" data-action="session">${icon('spark',17)} Practice filtered set</button></div>`)}<section class="library-controls"><div class="library-search">${icon('search',19)}<input id="library-search" type="search" placeholder="Search questions, concepts, or question IDs…" value="${e(filters.search)}" aria-label="Search the practice library"><kbd>/</kbd></div><div class="filters">${selectFilter('module','Module',modules.map(m=>[m.id,m.title]))}${selectFilter('topic','Topic',topics.map(t=>[t.id,t.name]))}${selectFilter('type','Type',Object.entries(types))}${selectFilter('difficulty','Difficulty',['Foundation','Application','Reasoning'].map(x=>[x,x]))}${selectFilter('status','Status',['New','Learning','Reviewed','Mastered','Due'].map(x=>[x,x]))}${selectFilter('priority','Priority',['High','Normal','Low'].map(x=>[x,x]))}</div><div class="filter-footer">${scopeControl()}<button class="text-link" data-action="clear-filters">Reset filters ${icon('x',13)}</button></div></section><div id="question-results">${questionResults()}</div>`;}
function filtered(){return visibleQuestions(state).filter(q=>matches(q,state.records[q.id],filters));}
function questionResults(){const qs=filtered();return `<div class="results-caption"><span><strong>${qs.length}</strong> ${qs.length===1?'question':'questions'} ${Object.values(filters).some(Boolean)?'matching your filters':'to explore'}</span><span>Studied this term · course-specific details pending</span></div><div class="panel question-list">${qs.length?qs.map(q=>questionRow(q)).join(''):empty('search','No questions in this combination.','Try a broader filter, or include the clearly labeled scope-pending examples.',`<button class="button secondary" data-action="clear-filters">Clear filters</button>`)}</div>`;}
function conceptPage(){const cs=concepts.filter(c=>(!conceptTopic||c.topic===conceptTopic)&&(c.scope==='core'||state.settings.showExamples));return `${pageHeading('THE CONCEPT STUDIO','Understand the why.','Small explanations. Useful connections. No memorizing without meaning.')}<div class="concept-toolbar"><div class="tabs" aria-label="Concept topics"><button data-action="concept-tab" data-id="" class="${!conceptTopic?'selected':''}">All concepts</button>${topics.map(t=>`<button data-action="concept-tab" data-id="${t.id}" class="${conceptTopic===t.id?'selected':''}">${t.short}</button>`).join('')}</div>${scopeControl()}</div><div class="concept-grid">${cs.length?cs.map(c=>{const t=topic(c.topic);return `<button class="concept-card" data-action="concept" data-id="${c.id}"><span class="concept-card-top"><span class="stat-icon ${t.color}">${icon(t.icon,24)}</span>${c.scope==='example'?badge('Scope pending','pending'):badge('Foundation','subtle')}</span><small class="eyebrow">${e(t.name)}</small><h2>${e(c.title)}</h2><p>${e(c.takeaway)}</p><span class="text-link">Explore concept ${icon('arrow',17)}</span></button>`;}).join(''):empty('layers','This topic is waiting for scope confirmation.','Include the labeled examples to explore general techniques, or add confirmed course details in Scope & TODO.')}</div>`;}
function mistakes(){const qs=visibleQuestions(state).filter(q=>state.records[q.id]?.attempts.some(a=>!a.correct)).filter(q=>journalAll||status(state.records[q.id])==='Learning');return `${pageHeading('THE MISTAKE JOURNAL','Every mistake leaves a clue.','Capture the reason. Revisit the idea. Watch the pattern change.',`<button class="button primary" data-action="review-mistakes">Review these questions ${icon('arrow',17)}</button>`)}<div class="journal-toolbar"><div class="tabs"><button data-action="journal-tab" data-id="open" class="${!journalAll?'selected':''}">Still learning</button><button data-action="journal-tab" data-id="all" class="${journalAll?'selected':''}">All past mistakes</button></div>${scopeControl()}</div><div class="journal-list">${qs.length?qs.map(q=>{const r=state.records[q.id],a=r.attempts.filter(a=>!a.correct).at(-1);return `<article class="panel journal-card"><div class="journal-card-head"><div>${badge(topic(q.topic).short,'subtle')} ${badge(status(r),status(r).toLowerCase())}<h2>${e(q.title)}</h2></div><button class="icon-button" data-action="question" data-id="${q.id}" aria-label="Review ${e(q.title)}">${icon('arrow')}</button></div><div class="journal-detail"><div><span class="field-label">LAST INCORRECT ANSWER</span><p>${e(answerText(q,a.answer))}</p></div><div><span class="field-label">WHAT TRIPPED ME UP</span><p>${e(a.reason||'No reason recorded yet. Open the question to add one.')}</p>${a.reflection?`<small>${e(a.reflection)}</small>`:''}</div><div><span class="field-label">NEXT REVIEW</span><p>${fmtDate(r.nextReview)}</p><small>${a.confidence===3?'High':a.confidence===2?'Medium':'Low'} confidence · ${r.attempts.length} attempts</small></div></div></article>`;}).join(''):empty('leaf','Nothing to untangle here.','Your incorrect answers will appear here, along with the reasons and reflections you record.',`<a class="button primary" href="#practice">Explore the library ${icon('arrow',17)}</a>`)}</div>`;}
function planner(){const scheduled=visibleQuestions(state).filter(q=>state.records[q.id]?.nextReview).sort((a,b)=>new Date(state.records[a.id].nextReview)-new Date(state.records[b.id].nextReview));const today=new Date();today.setHours(0,0,0,0);return `${pageHeading('YOUR STUDY PLANNER','Come back before it fades.','Reviews follow your answers and confidence. You can always choose another date.',`<button class="button primary" data-action="due-session">Review due questions ${icon('arrow',17)}</button>`)}<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(d.getDate()+i);const count=scheduled.filter(q=>dateInput(state.records[q.id].nextReview)===dateInput(d)).length;return `<div class="day-card ${i===0?'today':''}"><span>${i===0?'TODAY':fmtDate(d,{weekday:'short'}).toUpperCase()}</span><strong>${d.getDate()}</strong><small>${count} ${count===1?'review':'reviews'}</small><div class="day-dots">${Array.from({length:Math.min(5,count)},()=>'<i></i>').join('')}</div></div>`;}).join('')}</div><div class="planner-columns"><section class="panel"><div class="section-title"><div><h2>The next time around</h2><p>All scheduled questions, soonest first.</p></div>${badge(scheduled.length+' scheduled','subtle')}</div>${scheduled.length?scheduled.map(q=>`<div class="scheduled-row"><button data-action="question" data-id="${q.id}"><span class="stat-icon ${topic(q.topic).color}">${icon(topic(q.topic).icon,19)}</span><span><strong>${e(q.title)}</strong><small>${q.id} · ${e(topic(q.topic).short)}</small></span></button><span class="schedule-date ${isDue(state.records[q.id])?'overdue':''}">${isDue(state.records[q.id])?'Due · ':''}${fmtDate(state.records[q.id].nextReview)}</span></div>`).join(''):empty('calendar','Your schedule starts with one answer.','Finish a question and a review date will be created automatically.')}</section><aside class="panel planner-explainer"><span class="stat-icon mint">${icon('leaf',25)}</span><h2>A gentle rhythm.</h2><p>A suggested review date is created after every attempt.</p><dl><div><dt>Incorrect, hinted, or low confidence</dt><dd>1 day</dd></div><div><dt>Correct · medium confidence</dt><dd>3 days</dd></div><div><dt>Correct · high confidence</dt><dd>7–14 days</dd></div></dl><p class="fine-print">Mastery requires two consecutive correct, high-confidence attempts without hints or concept teaching. This is a simple learning heuristic; you can override any date.</p></aside></div>`;}
function scopePage(){if(teaching())return `${pageHeading('CONTENT NOTES','A transparent starting point.','The requested review objectives guide this workspace. Specific unconfirmed techniques stay labeled as examples.')}<a class="button primary" href="#concepts">Explore concepts</a>`;return `${pageHeading('SCOPE & CONTENT BACKLOG','Leave room for what’s next.','Your studied content is mapped to four modules. Course-specific details stay explicit.',`<button class="button secondary" data-action="add-todo">${icon('plus',17)} Add TODO</button>`)}${coverageTable()}<div class="scope-overview"><section class="panel"><div class="section-title"><div><h2>The requested review objectives</h2><p>From your updated brief · studied content is not an official final-exam blueprint.</p></div>${badge('10 objectives','subtle')}</div><ol class="objective-list">${objectives.map(o=>`<li><span>${icon('check',15)}</span>${e(o)}</li>`).join('')}</ol></section><aside class="scope-note"><span class="stat-icon sand">${icon('flag',26)}</span><h2>Specifics stay pending.</h2><p>Your studied techniques and reaction families are now included. Exact substrates, spectra, workups, reference values, and grading thresholds have not been assumed.</p><p>Questions use general principles and explicitly stated hypothetical conditions. Marking a TODO done does not establish professor approval or final-exam weighting.</p><button class="text-link" data-action="sources">View content references ${icon('arrow',17)}</button></aside></div><div class="section-title todo-heading"><div><h2>The working TODO list</h2><p>${state.todos.filter(t=>t.status!=='Done').length} items still open · changes are saved in this browser</p></div></div><div class="todo-grid">${state.todos.map(t=>`<article class="panel todo-card"><div class="todo-top">${badge(t.category,'subtle')}<span class="priority ${t.priority}">${icon('flag',12)} ${e(t.priority)}</span></div><h3>${e(t.title)}</h3><p>${e(t.description)}</p><label class="field-label" for="todo-notes-${e(t.id)}">NOTES / CONFIRMED DETAILS</label><textarea id="todo-notes-${e(t.id)}" data-todo-notes="${e(t.id)}" placeholder="Add the professor’s confirmed details…" rows="2">${e(t.notes)}</textarea><div class="todo-card-bottom"><label><span class="sr-only">Status for ${e(t.title)}</span><select data-todo-status="${e(t.id)}">${['Pending','In progress','Done'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select></label><span>${t.status==='Done'?icon('check',15)+' Completed':icon('clock',15)+' To be confirmed'}</span></div></article>`).join('')}</div>`;}
function settings(){const s=stats();return `${pageHeading('MAKE IT YOURS','A space that keeps your work.','Your answers belong to you. Keep a backup and study at your own pace.')}<div class="settings-grid"><section class="panel settings-card"><span class="stat-icon mint">${icon('download',24)}</span><h2>Study data & backup</h2><p>Answers, full attempt history, confidence, error reasons, notes, priority, review dates, custom questions, and TODOs are saved in this browser.</p><div class="data-summary">${s.attempts} attempts <span>·</span> ${Object.keys(state.records).length} question records <span>·</span> ${state.customQuestions.length} custom questions</div><div class="button-row"><button class="button primary" data-action="export">${icon('download',17)} Export backup</button><label class="button secondary" for="import-file">${icon('upload',17)} Restore backup</label><input type="file" accept="application/json,.json" id="import-file" class="sr-only"></div><p class="fine-print">Export a JSON file before switching devices or clearing browser data. Restore validates the file, then asks before replacing this browser’s workspace. There is no cloud sync.</p></section><section class="panel settings-card"><span class="stat-icon peach">${icon('settings',24)}</span><h2>Your practice preferences</h2><label class="settings-field">Questions per session<select id="session-size">${[5,10,20].map(n=>`<option ${state.settings.sessionSize===n?'selected':''}>${n}</option>`).join('')}</select></label><div class="setting-divider"></div>${scopeControl()}<p class="fine-print">Custom additions start as scope pending until you review them against the course in the question notebook.</p><div class="setting-divider"></div><button class="button secondary" data-action="mode">${icon('globe',17)} ${teaching()?'Return to personal workspace':'Open teaching preview'}</button></section><section class="panel settings-card"><span class="stat-icon lavender">${icon('lock',24)}</span><h2>From private to classroom</h2><p>This workspace is designed for private study first. Teaching preview hides content-authoring controls and unconfirmed examples by default; it does not change visitor access.</p><p>When the content is ready, ask to open this Site to students through Sites. Each student’s progress stays in their own browser. No student roster, class analytics, or grade submission is collected.</p><button class="text-link" data-action="about">How this workspace works ${icon('arrow',17)}</button></section><section class="panel settings-card"><span class="stat-icon sand">${icon('book',24)}</span><h2>Content with a clear boundary</h2><p>The four modules and studied content follow your updated brief. Questions are original teaching illustrations; exact laboratory variants and final-exam weighting remain pending.</p><button class="button secondary" data-action="sources">References & content notes ${icon('external',16)}</button><a class="text-link settings-scope" href="#scope">Review the scope backlog ${icon('arrow',17)}</a></section></div>`;}
