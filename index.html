function startSession(qs,label='Study session'){
 if(!qs.length){toast('No questions match this review set. Try the practice library.');return;}
 const ordered=[...qs].sort((a,b)=>{const weight=q=>(isDue(state.records[q.id])?100:0)+(status(state.records[q.id])==='Learning'?30:0)+(!latest(state.records[q.id])?10:0)+((state.records[q.id]?.priority||q.priority)==='High'?5:0);return weight(b)-weight(a);});
 session={ids:ordered.slice(0,state.settings.sessionSize).map(q=>q.id),index:0,results:[],label};openQuestion(session.ids[0]);
}
function openQuestion(id){
 const q=byId(id);if(!q||!allowed(q)){toast('This question is outside the currently visible scope.');return;}
 modalReturn=document.activeElement;current={q,answer:initialAnswer(q),confidence:0,hints:0,conceptViewed:false,flipped:false,checked:false,attempt:null,tab:'practice'};renderStudy();if(!$('#study-dialog').open)$('#study-dialog').showModal();
}
function closeStudy(){if(current?.checked)saveFeedback();$('#study-dialog').close();current=null;session=null;render();modalReturn?.focus?.();}
$('#study-dialog').addEventListener('cancel',ev=>{ev.preventDefault();closeStudy();});
function studyForm(q){
 if(q.type==='flashcard')return `<div class="flashcard-study"><span class="eyebrow">RECALL FIRST · THEN REVEAL</span>${current.flipped||current.checked?`<p class="flashcard-back">${e(q.back)}</p><span class="flashcard-note">How did your recall compare? This is a self-assessment, not an objective score.</span><div class="answer-options">${q.options.map((o,i)=>`<label class="answer-option ${current.answer===i?'chosen':''}"><input type="radio" name="answer" value="${i}" ${current.answer===i?'checked':''} ${current.checked?'disabled':''}><span class="option-letter">${i?'✓':'↻'}</span><span>${e(o)}</span></label>`).join('')}</div>`:`<div class="flashcard-question-mark">?</div><button class="button secondary" data-action="flip">Reveal the other side ${icon('layers',17)}</button>`}</div>`;
 if(q.type==='sorting')return `<p class="interaction-instruction">${icon('grid',16)} Sort each item into the appropriate category.</p><div class="matching-list sorting-list">${q.sortItems.map((item,i)=>`<label><span>${e(item.text)}</span><select data-sort="${i}" ${current.checked?'disabled':''}><option value="">Choose a category…</option>${q.categories.map(v=>`<option value="${e(v)}" ${current.answer[i]===v?'selected':''}>${e(v)}</option>`).join('')}</select></label>`).join('')}</div>`;
 if(q.type==='multistep')return `<div class="multistep-list">${q.stages.map((stage,i)=>`<fieldset><legend>${e(stage.prompt)}</legend>${stage.options.map((o,j)=>`<label class="stage-option"><input type="radio" name="stage-${i}" data-stage="${i}" value="${j}" ${current.answer[i]===j?'checked':''} ${current.checked?'disabled':''}><span>${e(o)}</span></label>`).join('')}</fieldset>`).join('')}</div>`;
 if(q.type==='ordering')return `<p class="interaction-instruction">${icon('route',16)} Use the arrows to arrange the steps from first to last.</p><ol class="ordering-list">${current.answer.map((item,i)=>`<li><span class="step-number">${i+1}</span><span>${e(q.items[item])}</span><div class="order-arrows"><button class="icon-button" data-action="move" data-index="${i}" data-direction="-1" ${i===0||current.checked?'disabled':''} aria-label="Move step ${i+1} up">${icon('up',16)}</button><button class="icon-button" data-action="move" data-index="${i}" data-direction="1" ${i===current.answer.length-1||current.checked?'disabled':''} aria-label="Move step ${i+1} down">${icon('down',16)}</button></div></li>`).join('')}</ol>`;
 if(q.type==='matching'){const options=q.pairs.map(p=>p[1]);options.push(options.shift());return `<p class="interaction-instruction">${icon('matching',16)} Choose the matching term for each description.</p><div class="matching-list">${q.pairs.map((p,i)=>`<label><span>${e(p[0])}</span><select data-match="${i}" ${current.checked?'disabled':''}><option value="">Choose a match…</option>${options.map(v=>`<option value="${e(v)}" ${current.answer[i]===v?'selected':''}>${e(v)}</option>`).join('')}</select></label>`).join('')}</div>`;}
 return `<div class="answer-options" role="radiogroup" aria-label="Answer choices">${q.options.map((o,i)=>`<label class="answer-option ${current.answer===i?'chosen':''} ${current.checked&&q.answer===i?'correct-answer':''} ${current.checked&&current.answer===i&&!current.attempt.correct?'wrong-answer':''}"><input type="radio" name="answer" value="${i}" ${current.answer===i?'checked':''} ${current.checked?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${e(o)}</span>${current.checked&&q.answer===i?icon('check',19):''}</label>`).join('')}</div>`;
}
function conceptInline(q){const c=concepts.find(c=>c.id===q.concept);return c?`<div class="inline-concept"><span class="eyebrow">THE IDEA BEHIND THE QUESTION</span><h3>${e(c.title)}</h3><p class="takeaway">${e(c.takeaway)}</p>${c.body.map(t=>`<p>${e(t)}</p>`).join('')}<div class="concept-trap">${icon('flag',17)}<span>${e(c.trap)}</span></div>${sourceLink(c.source)}</div>`:empty('book','Your own course connection.','This custom question has no linked concept card. Add your reasoning in its explanation or question notes.');}
function renderStudy(){
 const {q}=current,t=topic(q.topic),r=state.records[q.id];
 $('#study-dialog').innerHTML=`<div class="dialog-top"><div class="dialog-brand">${icon('flask',20)} <strong>${session?e(session.label):'A little focused practice'}</strong></div><button class="icon-button" data-action="close-study" aria-label="Close question">${icon('x')}</button></div>${session?`<div class="session-strip"><span>Question ${session.index+1} of ${session.ids.length}</span><div class="progress-track"><span style="width:${session.index/session.ids.length*100}%"></span></div><span>${session.results.filter(x=>x.correct).length} correct</span></div>`:''}<div class="study-main"><div class="study-meta">${badge(t.short,t.color)} ${badge(types[q.type],'subtle')} ${badge(q.difficulty,'subtle')} ${scopeBadge(q)}</div><div class="study-title-row"><span class="question-id">${q.id}</span><button class="text-link" data-action="notebook" data-id="${q.id}">${icon('book',15)} Notes & history ${r?.attempts.length?`(${r.attempts.length})`:''}</button></div><h2 id="dialog-title">${e(q.title)}</h2><div class="study-tabs tabs"><button data-action="study-tab" data-id="practice" class="${current.tab==='practice'?'selected':''}">Practice</button><button data-action="study-tab" data-id="concept" class="${current.tab==='concept'?'selected':''}">Concept teaching</button></div>${current.tab==='concept'?conceptInline(q):`<p class="question-prompt">${e(q.prompt)}</p>${q.figure?apparatusDiagram(q.figure):''}${q.dataTable?dataTable(q.dataTable):''}${q.scope==='example'&&!state.scopeApprovals[q.id]?'<p class="scope-inline">General teaching illustration · the specific technique or reaction is not confirmed for your final.</p>':''}${studyForm(q)}${!current.checked?`<div class="confidence-block"><span>How sure are you?</span><div class="confidence-options">${[[1,'Still figuring it out'],[2,'Fairly sure'],[3,'Very sure']].map(([v,l])=>`<label class="${current.confidence===v?'selected':''}"><input type="radio" name="confidence" value="${v}" ${current.confidence===v?'checked':''}>${['','○','◐','●'][v]} ${l}</label>`).join('')}</div></div><div class="hint-block">${current.hints?q.hints.slice(0,current.hints).map((h,i)=>`<p>${icon('spark',15)}<span><strong>Hint ${i+1}.</strong> ${e(h)}</span></p>`).join(''):''}<button class="text-link" data-action="hint" ${current.hints===q.hints.length?'disabled':''}>${icon('spark',16)} ${current.hints===q.hints.length?'All hints revealed':current.hints?'Show the next hint':'A little hint, please'} <span>${current.hints}/${q.hints.length}</span></button></div><div id="answer-error" class="form-error" role="alert"></div>`:feedback(q)} `}</div><div class="dialog-bottom"><span>${current.checked?icon('check',15)+' Answer saved in this browser':icon('lock',14)+' Your progress, at your pace'}</span>${current.tab==='concept'?`<button class="button primary" data-action="study-tab" data-id="practice">Back to practice ${icon('arrow',17)}</button>`:current.checked?`<div class="button-row"><button class="button secondary" data-action="retry">Try again</button><button class="button primary" data-action="next">${session?(session.index===session.ids.length-1?'See session summary':'Next question'):'Done for now'} ${icon('arrow',17)}</button></div>`:`<button class="button primary" data-action="check">${q.type==='flashcard'?'Save recall check':'Check my answer'} ${icon('arrow',17)}</button>`}</div>`;
 $$('input[name="answer"]',$('#study-dialog')).forEach(el=>el.addEventListener('change',()=>{current.answer=Number(el.value);$$('.answer-option',$('#study-dialog')).forEach(l=>l.classList.toggle('chosen',$('input',l).checked));}));
 $$('input[name="confidence"]',$('#study-dialog')).forEach(el=>el.addEventListener('change',()=>{current.confidence=Number(el.value);$$('.confidence-options label',$('#study-dialog')).forEach(l=>l.classList.toggle('selected',$('input',l).checked));}));
 $$('[data-match]',$('#study-dialog')).forEach(el=>el.addEventListener('change',()=>{current.answer[Number(el.dataset.match)]=el.value;}));
 $$('[data-sort]',$('#study-dialog')).forEach(el=>el.addEventListener('change',()=>{current.answer[Number(el.dataset.sort)]=el.value;}));
 $$('[data-stage]',$('#study-dialog')).forEach(el=>el.addEventListener('change',()=>{current.answer[Number(el.dataset.stage)]=Number(el.value);}));
 if(current.checked)bindFeedback();
}
function moveItem(i,d){if(current.checked)return;const j=i+d;if(j<0||j>=current.answer.length)return;[current.answer[i],current.answer[j]]=[current.answer[j],current.answer[i]];renderStudy();$(`[data-action="move"][data-index="${j}"][data-direction="${d}"]`,$('#study-dialog'))?.focus();}
function submitAnswer(){try{current.attempt=recordAttempt(state,current.q,{answer:current.answer,confidence:current.confidence,hintsUsed:current.hints,conceptViewed:current.conceptViewed});current.checked=true;persist();if(session)session.results[session.index]={id:current.q.id,correct:current.attempt.correct,hinted:current.hints>0||current.conceptViewed,selfRated:current.q.type==='flashcard'};renderStudy();$('.feedback',$('#study-dialog'))?.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(err){$('#answer-error').textContent=err.message;}}
function correctText(q){if(q.type==='sorting')return q.sortItems.map(x=>`${x.text} → ${x.category}`).join('\n');if(q.type==='multistep')return q.stages.map((x,i)=>`${i+1}. ${x.options[x.answer]}`).join('\n');return q.type==='matching'?q.pairs.map(p=>`${p[0]} → ${p[1]}`).join('\n'):q.type==='ordering'?q.items.map((x,i)=>`${i+1}. ${x}`).join('\n'):q.options[q.answer];}
function answerText(q,a){if(q.type==='sorting')return q.sortItems.map((x,i)=>`${x.text} → ${a[i]||'—'}`).join('; ');if(q.type==='multistep')return q.stages.map((x,i)=>`${i+1}. ${x.options[a[i]]||'—'}`).join('; ');if(q.type==='matching')return q.pairs.map((p,i)=>`${p[0]} → ${a[i]||'—'}`).join('; ');if(q.type==='ordering')return a.map((n,i)=>`${i+1}. ${q.items[n]}`).join(' → ');return q.options[a]||'No answer';}
const reasons=['Concept gap','Misread the prompt','Wrong technique choice','Sequence / dependency error','Calculation error','Overinterpreted the evidence','Guess / low confidence','Other'];
function feedback(q){const a=current.attempt,r=state.records[q.id];return `<section class="feedback ${a.correct?'success':'needs-work'}"><div class="feedback-heading">${icon(a.correct?'check':'leaf',23)}<div><h3>${q.type==='flashcard'?(a.correct?'Recall logged.':'Another look, another connection.'):(a.correct?'That connection clicked.':'A useful place to pause.')}</h3><p>${a.correct?((a.hintsUsed||a.conceptViewed)?'Correct with learning support. Revisit this without support next time.':'Correct. Keep the reasoning with the answer.'):'The answer is saved. Let’s untangle the reasoning.'}</p></div></div>${!a.correct||['matching','ordering','sorting','multistep'].includes(q.type)?`<div class="correct-explanation"><span class="field-label">${q.type==='ordering'?'CORRECT SEQUENCE':q.type==='matching'?'CORRECT PAIRS':'CORRECT ANSWER'}</span><p>${e(correctText(q))}</p></div>`:''}<details class="answer-analysis" open><summary>Unpack the reasoning</summary><p class="explanation">${e(q.explanation)}</p></details></section><section class="reflection"><h3>A note for your future self</h3><div class="reflection-grid"><label>${a.correct?'Anything that felt uncertain?':'What tripped you up?'}<select id="error-reason"><option value="">Choose a reason (optional)</option>${reasons.map(r=>`<option ${a.reason===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Next review<input type="date" id="next-review" value="${dateInput(r.nextReview)}"></label><label>Priority<select id="question-priority">${['High','Normal','Low'].map(p=>`<option ${(r.priority||q.priority)===p?'selected':''}>${p}</option>`).join('')}</select></label></div><label class="reflection-label">Why did I choose that answer?<textarea id="reflection" rows="2" placeholder="A misconception, a useful cue, or what to check next time…">${e(a.reflection)}</textarea></label><label class="reflection-label">Question notes<textarea id="question-notes" rows="2" placeholder="Keep a lasting note for this question…">${e(r.notes)}</textarea></label><small class="autosave-note">Changes save automatically.</small></section>`;}
function bindFeedback(){for(const id of ['error-reason','next-review','question-priority','reflection','question-notes'])$('#'+id,$('#study-dialog'))?.addEventListener('input',saveFeedback);}
function saveFeedback(){if(!current?.checked)return;const root=$('#study-dialog'),r=state.records[current.q.id],a=current.attempt;if($('#error-reason',root))a.reason=$('#error-reason',root).value;if($('#reflection',root))a.reflection=$('#reflection',root).value;if($('#question-notes',root))r.notes=$('#question-notes',root).value;if($('#question-priority',root))r.priority=$('#question-priority',root).value;if($('#next-review',root))r.nextReview=localDateISO($('#next-review',root).value);persist();}
function nextQuestion(){saveFeedback();if(!session){closeStudy();return;}if(session.index<session.ids.length-1){session.index++;openQuestion(session.ids[session.index]);return;}const done=session,correct=done.results.filter(x=>x.correct).length;$('#study-dialog').innerHTML=`<div class="dialog-top"><strong>Study session complete</strong><button class="icon-button" data-action="close-study" aria-label="Close summary">${icon('x')}</button></div><div class="session-summary"><span class="summary-icon">${icon('leaf',48)}</span><span class="eyebrow">A LITTLE STRONGER THAN BEFORE</span><h2 id="dialog-title">That’s progress.</h2><p>${done.results.every(x=>x.selfRated)?`You reviewed ${done.ids.length} recall cards and marked ${correct} as recalled. These self-assessments are excluded from objective accuracy.`:`You explored ${done.ids.length} questions and made ${correct} correct connections.`}</p><div class="summary-stats"><div><strong>${correct}/${done.ids.length}</strong><span>${done.results.every(x=>x.selfRated)?'marked recalled':'correct answers'}</span></div><div><strong>${done.results.filter(x=>x.hinted).length}</strong><span>questions with support</span></div><div><strong>${done.ids.length-correct}</strong><span>ideas to revisit</span></div></div><p class="fine-print">Every answer, confidence level, and reflection has been saved. Your next reviews are waiting in the planner.</p><button class="button primary" data-action="close-study">Back to my workspace ${icon('arrow',18)}</button></div>`;current=null;session=null;}

function openInfo(title,body,cls=''){const d=$('#info-dialog');d.className=cls;d.innerHTML=`<div class="dialog-top"><strong id="info-title">${title}</strong><button class="icon-button" data-action="close-info" aria-label="Close dialog">${icon('x')}</button></div><div class="info-body">${body}</div>`;if(!d.open)d.showModal();}
function sourceLink(id){const s=sources.find(s=>s.id===id);return s?`<a class="source-link" href="${s.url}" target="_blank" rel="noopener noreferrer">Background reading: ${e(s.name)} ${icon('external',13)}</a>`:'';}
function openConcept(id){const c=concepts.find(c=>c.id===id);if(!c)return;const t=topic(c.topic);openInfo('Concept studio',`<span class="stat-icon ${t.color}">${icon(t.icon,29)}</span><div class="concept-detail"><span class="eyebrow">${e(c.kicker)}</span><h2>${e(c.title)}</h2>${c.scope==='example'?'<p class="scope-inline">Technique illustration · specific exam coverage is unconfirmed.</p>':''}<p class="takeaway">${e(c.takeaway)}</p>${c.body.map((b,i)=>`<p><span class="paragraph-number">0${i+1}</span>${e(b)}</p>`).join('')}${c.demo?demo(c.demo):''}<div class="concept-trap">${icon('flag',19)}<span><strong>Watch the shortcut.</strong> ${e(c.trap)}</span></div>${sourceLink(c.source)}<button class="button primary concept-practice" id="concept-practice">Practice this concept ${icon('arrow',18)}</button></div>`,'concept-dialog');bindDemo(c.demo);$('#concept-practice').addEventListener('click',()=>{$('#info-dialog').close();const qs=visibleQuestions(state).filter(q=>q.concept===c.id);if(qs.length)startSession(qs,'Concept practice');else toast('Enable scope-pending examples in the library to practice this technique.');});}
function demo(kind){
 if(kind==='solubility')return `<div class="demo"><span class="eyebrow">TRY A SIMPLE MODEL</span><label for="solute-range">Solute added: <strong id="solute-value">3.0 g</strong></label><input id="solute-range" type="range" min="0" max="10" step="0.5" value="3"><div class="solubility-demo"><div class="beaker"><div class="beaker-liquid"></div><div id="undissolved"></div></div><div><strong id="dissolved-value">3.0 g dissolved</strong><span id="solid-value">0.0 g undissolved</span><small>Hypothetical limit: 5.0 g in this fixed volume<br>at a constant temperature. Equilibrium assumed.</small></div></div></div>`;
 if(kind==='polarity')return `<div class="demo"><span class="eyebrow">CHANGE THE GEOMETRY</span><div class="tabs demo-tabs"><button id="linear-btn" class="selected">Linear · CO₂ model</button><button id="bent-btn">Bent · H₂O model</button></div><svg id="dipole-demo" viewBox="0 0 340 120" role="img" aria-label="Symmetric linear bond dipoles cancel"><path id="bond-left" d="M170 55H85" stroke="#254f42" stroke-width="3"/><path id="bond-right" d="M170 55H255" stroke="#254f42" stroke-width="3"/><circle cx="170" cy="55" r="19" fill="#254f42"/><circle id="atom-left" cx="85" cy="55" r="17" fill="#dda38e"/><circle id="atom-right" cx="255" cy="55" r="17" fill="#dda38e"/><text id="dipole-note" x="170" y="108" text-anchor="middle" fill="#254f42" font-size="13">Equal, opposite bond dipoles → no net dipole</text></svg><p class="fine-print">Schematic, not to scale. Geometry and bond polarity both matter.</p></div>`;
 if(kind==='melting')return `<div class="demo"><span class="eyebrow">COMPARE HYPOTHETICAL RANGES</span><label for="range-demo">Sample condition<select id="range-demo"><option value="narrow">Narrow · close to reference</option><option value="broad">Broad · depressed</option></select></label><div class="range-scale"><span>110 °C</span><span>130 °C</span></div><div class="range-track"><i class="reference-range"></i><i id="sample-range" class="sample-range"></i></div><p id="range-caption">Reference: 128–130 °C · sample: 128–130 °C. Consistent, but not unique proof of identity.</p></div>`;
 if(kind==='extraction')return `<div class="demo"><span class="eyebrow">DENSITY SETS THE LAYER ORDER</span><label>Organic phase relative to water<select id="layer-demo"><option value="lighter">Less dense (hypothetical 0.8 g/mL)</option><option value="heavier">More dense (hypothetical 1.3 g/mL)</option></select></label><div id="layers-demo"><div class="layer organic">Organic phase</div><div class="layer aqueous">Aqueous phase</div></div><p class="fine-print">Assume immiscible phases and no large solute effects. Confirm layers in a real experiment.</p></div>`;
 if(kind==='tlc')return `<div class="demo"><span class="eyebrow">MOVE A HYPOTHETICAL SPOT</span><label for="tlc-distance">Spot distance: <strong id="tlc-value">2.4 cm</strong></label><input type="range" id="tlc-distance" min="0" max="6" step="0.1" value="2.4"><div class="tlc-model"><div class="tlc-plate"><div class="tlc-front">solvent front · 6.0 cm</div><span id="tlc-spot"></span><div class="tlc-baseline">baseline</div></div><strong id="tlc-rf">Rf = 0.40</strong></div><p class="fine-print">Distances start at the same baseline. This is a calculation model, not a prediction of a compound’s behavior.</p></div>`;
 return '';
}
function bindDemo(kind){
 $('#solute-range')?.addEventListener('input',ev=>{const n=Number(ev.target.value);$('#solute-value').textContent=n.toFixed(1)+' g';$('#dissolved-value').textContent=Math.min(5,n).toFixed(1)+' g dissolved';$('#solid-value').textContent=Math.max(0,n-5).toFixed(1)+' g undissolved';$('#undissolved').style.height=Math.max(0,n-5)*3+'px';$('.beaker-liquid').style.opacity=0.25+Math.min(5,n)*.1;});
 const geometry=bent=>{const left=bent?'M170 35 105 80':'M170 55H85',right=bent?'M170 35 235 80':'M170 55H255';$('#bond-left').setAttribute('d',left);$('#bond-right').setAttribute('d',right);$('#atom-left').setAttribute('cx',bent?105:85);$('#atom-left').setAttribute('cy',bent?80:55);$('#atom-right').setAttribute('cx',bent?235:255);$('#atom-right').setAttribute('cy',bent?80:55);$('#dipole-demo circle[cx="170"]').setAttribute('cy',bent?35:55);$('#dipole-note').textContent=bent?'Bent geometry → bond dipoles do not cancel':'Equal, opposite bond dipoles → no net dipole';$('#dipole-demo').setAttribute('aria-label',bent?'Bent polar molecule has a nonzero net dipole':'Symmetric linear bond dipoles cancel');$('#linear-btn').classList.toggle('selected',!bent);$('#bent-btn').classList.toggle('selected',bent);};
 $('#linear-btn')?.addEventListener('click',()=>geometry(false));$('#bent-btn')?.addEventListener('click',()=>geometry(true));
 $('#range-demo')?.addEventListener('change',ev=>{const broad=ev.target.value==='broad';$('#sample-range').style.left=broad?'25%':'90%';$('#sample-range').style.width=broad?'45%':'10%';$('#range-caption').textContent=broad?'Reference: 128–130 °C · sample: 115–124 °C. Investigate purity, residual solvent, and measurement conditions.':'Reference: 128–130 °C · sample: 128–130 °C. Consistent, but not unique proof of identity.';});
 $('#layer-demo')?.addEventListener('change',ev=>$('#layers-demo').classList.toggle('reverse',ev.target.value==='heavier'));
 $('#tlc-distance')?.addEventListener('input',ev=>{const n=Number(ev.target.value);$('#tlc-value').textContent=n.toFixed(1)+' cm';$('#tlc-rf').textContent='Rf = '+(n/6).toFixed(2);$('#tlc-spot').style.bottom=(12+n/6*140)+'px';});
}
function openSources(){openInfo('References & content notes',`<h2>Good learning has a paper trail.</h2><p>The explanations, apparatus schematics, and hypothetical questions are written for this workspace. These primary educational references provide background; none establishes what is on your professor’s final.</p><div class="source-list">${sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer"><span><strong>${e(s.name)}</strong><small>${e(s.detail)}</small></span>${icon('external',18)}</a>`).join('')}</div><div class="concept-trap">${icon('flag',19)}<span>Exact substrates, experimental variants, spectra, accepted reference values, and final-exam weighting require course confirmation. Numerical question data are labeled hypothetical.</span></div>`);}
function openAbout(){openInfo('About this workspace',`<span class="stat-icon mint">${icon('flask',28)}</span><h2>The Reaction Room.</h2><p>A private-first review space for understanding organic chemistry lab reasoning, with a path to classroom use.</p><ul class="about-list"><li>Explore the concept, answer a question, and choose your confidence before checking.</li><li>Use hints one step at a time. Your attempt records whether you used them.</li><li>Write a reason and a reflection, set a priority, and choose a review date.</li><li>Revisit the mistake journal and study planner. Full attempt history stays attached to each question.</li></ul><p class="fine-print">Browser-local records · no account profile, analytics, or cloud sync. Export backups in Settings. Teaching preview changes presentation only; Sites controls actual visitor access.</p>`);}
function openNotebook(id){const q=byId(id);const r=state.records[id] ||= {attempts:[],notes:'',priority:q.priority};openInfo('Question notebook',`<span class="eyebrow">${e(id)} · ${e(topic(q.topic).short)}</span><h2>${e(q.title)}</h2><label class="reflection-label">Question notes<textarea rows="3" id="notebook-notes" placeholder="A lasting note for this question…">${e(r.notes)}</textarea></label><div class="reflection-grid"><label>Priority<select id="notebook-priority">${['High','Normal','Low'].map(p=>`<option ${(r.priority||q.priority)===p?'selected':''}>${p}</option>`).join('')}</select></label><label>Next review<input type="date" id="notebook-date" value="${dateInput(r.nextReview)}"></label></div>${!teaching()&&q.scope==='example'?`<label class="approval-label"><input type="checkbox" id="approve-scope" ${state.scopeApprovals[id]?'checked':''}> I have reviewed this question against the confirmed course scope.</label><p class="fine-print">This is your local review flag, not a professor endorsement or a change for other browsers.</p>`:''}<h3 class="history-title">Attempt history <span>${r.attempts.length}</span></h3><div class="attempt-list">${r.attempts.length?[...r.attempts].reverse().map(a=>`<details><summary>${badge(a.correct?'Correct':'Incorrect',a.correct?'reviewed':'learning')}<span>${fmtDate(a.at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span><small>${['','Low','Medium','High'][a.confidence]} confidence · ${a.hintsUsed} hints${a.conceptViewed?' · concept viewed':''}</small></summary><p><strong>Your answer:</strong> ${e(answerText(q,a.answer))}</p><label>Reason<select data-attempt-reason="${e(a.id)}"><option value="">Not recorded</option>${reasons.map(v=>`<option ${a.reason===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Reflection<textarea rows="2" data-attempt-reflection="${e(a.id)}">${e(a.reflection)}</textarea></label></details>`).join(''):'<p class="fine-print">Your first submitted answer will start the history.</p>'}</div><span class="autosave-note">All notebook changes save automatically.</span>`);
 $('#notebook-notes').addEventListener('input',ev=>{r.notes=ev.target.value;persist();if(current?.checked&&$('#question-notes'))$('#question-notes').value=r.notes;});
 $('#notebook-priority').addEventListener('change',ev=>{r.priority=ev.target.value;persist();if(current?.checked&&$('#question-priority'))$('#question-priority').value=r.priority;});
 $('#notebook-date').addEventListener('change',ev=>{r.nextReview=localDateISO(ev.target.value);persist();if(current?.checked&&$('#next-review'))$('#next-review').value=ev.target.value;});
 $('#approve-scope')?.addEventListener('change',ev=>{if(ev.target.checked)state.scopeApprovals[id]=true;else delete state.scopeApprovals[id];persist();});
 $$('[data-attempt-reason]').forEach(el=>el.addEventListener('change',()=>{r.attempts.find(a=>a.id===el.dataset.attemptReason).reason=el.value;persist();if(current?.attempt&&current.attempt.id===el.dataset.attemptReason&&$('#error-reason'))$('#error-reason').value=el.value;}));
 $$('[data-attempt-reflection]').forEach(el=>el.addEventListener('input',()=>{r.attempts.find(a=>a.id===el.dataset.attemptReflection).reflection=el.value;persist();if(current?.attempt&&current.attempt.id===el.dataset.attemptReflection&&$('#reflection'))$('#reflection').value=el.value;}));
}
function exportBackup(){download('reaction-room-backup-'+dateInput(new Date())+'.json',JSON.stringify({app:'The Reaction Room',exportedAt:new Date().toISOString(),workspace:state},null,2),'application/json');toast('Your complete workspace backup is ready.');}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importBackup(ev){const file=ev.target.files[0];if(!file)return;try{if(file.size>8*1024*1024)throw new Error('Please use a backup smaller than 8 MB.');const candidate=validateBackup(JSON.parse(await file.text()));openInfo('Restore your workspace',`<h2>Ready to restore this backup?</h2><p>This file contains ${Object.keys(candidate.records).length} question records, ${Object.values(candidate.records).reduce((n,r)=>n+r.attempts.length,0)} attempts, and ${candidate.todos.length} TODOs.</p><p>Restoring replaces this browser’s current workspace. Export your current backup first if you want to keep it.</p><div class="button-row"><button class="button secondary" id="backup-current">Export current backup</button><button class="button primary" id="confirm-restore">Replace & restore</button></div>`);$('#backup-current').addEventListener('click',exportBackup);$('#confirm-restore').addEventListener('click',()=>{state=candidate;persist();$('#info-dialog').close();render();toast('Workspace restored.');});}catch(err){toast(err.message||'This backup could not be read.');}ev.target.value='';}
function addTodo(){openInfo('Add a content TODO',`<form id="todo-form"><label>Title<input name="title" required maxlength="150" placeholder="What still needs to be confirmed?"></label><label>Description<textarea name="description" rows="3" required placeholder="Keep missing details explicit."></textarea></label><div class="reflection-grid"><label>Priority<select name="priority"><option>High</option><option selected>Normal</option><option>Low</option></select></label><label>Category<select name="category"><option>Professor confirmation</option><option>Content to add</option><option>Teaching release</option></select></label></div><button class="button primary" type="submit">Add TODO ${icon('plus',17)}</button></form>`);$('#todo-form').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);state.todos.push({id:'todo-'+Date.now(),title:f.get('title').trim(),description:f.get('description').trim(),priority:f.get('priority'),category:f.get('category'),status:'Pending',notes:''});persist();$('#info-dialog').close();render();toast('TODO added.');});}
function addQuestion(){openInfo('Add a course question',`<form id="question-form"><p class="fine-print">New questions start as scope pending. Review the final content against your course before approving them in the question notebook.</p><label>Question title<input name="title" required maxlength="150"></label><div class="reflection-grid"><label>Topic<select name="topic">${topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></label><label>Question type<select name="type" id="new-question-type">${Object.entries(types).filter(([v])=>['mcq','scenario','matching','ordering'].includes(v)).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label>Difficulty<select name="difficulty"><option>Foundation</option><option>Application</option><option>Reasoning</option></select></label></div><label>Prompt<textarea name="prompt" rows="3" required></textarea></label><div id="question-structure"></div><label>Explanation<textarea name="explanation" rows="3" required></textarea></label><label>Hints · one per line, up to five<textarea name="hints" rows="2"></textarea></label><div id="new-question-error" class="form-error" role="alert"></div><button class="button primary" type="submit">Save question ${icon('plus',17)}</button></form>`);const structure=()=>{const type=$('#new-question-type').value;$('#question-structure').innerHTML=type==='ordering'?'<label>Steps in the correct order · 2–8 lines<textarea name="items" rows="5" required placeholder="First step\nSecond step\nThird step"></textarea></label>':type==='matching'?'<label>Correct pairs · one description | term per line, 2–8 pairs<textarea name="pairs" rows="5" required placeholder="Description | Matching term\nAnother description | Another term"></textarea></label>':'<label>Answer options · one per line, 2–6 options<textarea name="options" rows="4" required></textarea></label><label>Correct option number<input name="answer" type="number" min="1" max="6" required value="1"></label>';};structure();$('#new-question-type').addEventListener('change',structure);$('#question-form').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target),lines=x=>String(f.get(x)||'').split('\n').map(s=>s.trim()).filter(Boolean);const q={id:'USR-'+Date.now(),title:f.get('title').trim(),topic:f.get('topic'),type:f.get('type'),difficulty:f.get('difficulty'),scope:'example',priority:'Normal',prompt:f.get('prompt').trim(),explanation:f.get('explanation').trim(),hints:lines('hints')};if(q.type==='ordering')q.items=lines('items');else if(q.type==='matching')q.pairs=lines('pairs').map(p=>p.split('|').map(s=>s.trim()));else{q.options=lines('options');q.answer=Number(f.get('answer'))-1;}if(!validateQuestion(q)){$('#new-question-error').textContent='Check the answer structure, option number, and line counts. Matching terms must be unique. Use at most five hints.';return;}state.customQuestions.push(q);state.settings.showExamples=true;persist();$('#info-dialog').close();render();toast('Question saved as a scope-pending example.');});}

function moduleOverview(){return `<section class="module-overview"><div class="section-title"><div><span class="eyebrow">YOUR FOUR-PART STUDY PATH</span><h2>Choose your next quest.</h2></div><a href="#modules" class="text-link">Open course map ${icon('arrow',16)}</a></div>${moduleCards()}</section>`;}

 const m=modules.find(x=>x.id===selectedModule);
 if(!m)return `${pageHeading('THE COURSE MAP','Four modules. One connected lab.','Build from physical properties to techniques, decisions, and evidence.')}<div class="curriculum-banner">${icon('check',18)}<span><strong>${studiedContent.length} content areas studied this term</strong> · supplied by you. Exact experimental details and final-exam emphasis remain pending.</span></div>${moduleCards()}<div class="section-title"><div><h2>What each module helps you do</h2></div></div><div class="module-objectives-grid">${modules.map(m=>`<section class="panel module-objectives"><div class="eyebrow">MODULE ${m.number}</div><h2>${m.title}</h2><ul>${m.objectives.map(x=>`<li>${icon('check',14)}<span>${e(x)}</span></li>`).join('')}</ul><div class="module-tool-labels">${m.tools.map(x=>badge(x,'subtle')).join('')}</div><button class="text-link" data-action="module" data-id="${m.id}">Enter module ${icon('arrow',16)}</button></section>`).join('')}</div>`;
 const qs=visibleQuestions(state).filter(q=>moduleFor(q)===m.id),toolMap={fundamentals:['flashcard','matching','mcq'],techniques:['diagram','matching','mcq'],separation:['ordering','sorting','multistep'],analysis:['data','mcq','multistep']};
 const cs=concepts.filter(c=>moduleFor(c)===m.id||qs.some(q=>q.concept===c.id));
 return `${pageHeading('MODULE '+m.number,m.title,m.description,`<button class="button secondary" data-action="all-modules">${icon('grid',16)} All modules</button>`)}<section class="module-intro ${m.color}"><div><h2>${m.subtitle}</h2><ul>${m.objectives.map(x=>`<li>${icon('check',15)} ${e(x)}</li>`).join('')}</ul></div><button class="button primary" data-action="module-practice">Practice this module ${icon('arrow',17)}</button></section><div class="activity-grid">${toolMap[m.id].map(type=>{const n=qs.filter(q=>q.type===type).length;return `<button class="panel activity-card" data-action="module-tool" data-id="${type}" ${!n?'disabled':''}><span class="stat-icon ${m.color}">${icon({flashcard:'layers',diagram:'scan',matching:'matching',mcq:'list',ordering:'route',sorting:'grid',multistep:'flask',data:'scan'}[type],25)}</span><span><strong>${types[type]}</strong><small>${n} ${type==='flashcard'?'cards':'activities'}</small></span>${icon('arrow',18)}</button>`;}).join('')}</div><div class="section-title module-section"><div><h2>Ideas to keep close</h2><p>Open an explanation, try a model, or jump into practice.</p></div></div><div class="module-concept-list">${cs.map(c=>`<button data-action="concept" data-id="${c.id}"><span class="stat-icon ${topic(c.topic).color}">${icon(topic(c.topic).icon,20)}</span><span><strong>${e(c.title)}</strong><small>${e(c.kicker)}</small></span>${icon('chevron',16)}</button>`).join('')}</div><div class="section-title module-section"><div><h2>The full activity set</h2><p>${qs.length} questions and recall cards in this module.</p></div></div><div class="panel question-list">${qs.map(q=>questionRow(q)).join('')}</div>`;
}
